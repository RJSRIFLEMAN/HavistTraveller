services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-havist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-havist_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-havist}
    ports:
      - "5432:5432"
    volumes:
      - havist-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  havist-postgres:
